name: aistudio-to-api

services:
  app:
    build:
      context: .
      args:
        VERSION: "1.3.8"
    image: aistudio-to-api:local
    container_name: aistudio-to-api
    ports:
      - "127.0.0.1:7860:7860"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: UTC
      MAX_CONTEXTS: "4"
    volumes:
      - ./auth:/app/configs/auth
      - ./data:/app/data
    networks:
      - ai-stack
    restart: unless-stopped

networks:
  ai-stack:
    external: true
